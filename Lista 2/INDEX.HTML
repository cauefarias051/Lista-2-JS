<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <SCRIPT>
    var i = parseInt(prompt("Digite um número inteiro"))
    if(i % 2 == 0){
        alert("O numero: " + i + " é par")
    }
    else{
        alert("O número: " + i + " é impar")
    }
    </SCRIPT>
</body>
</html>
