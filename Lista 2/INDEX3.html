<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var i = parseFloat(prompt("Digite um número: "))

        if(i < 0){
            alert("O número: " + i + "é negativo")
        }
        else if( i == 0 ){
            alert("O número: " + i + "é igual a zero")
        }
        else if(i > 0){
             alert("O número: " + i + "é positivo")
        }
    </script>
</body>
</html>
